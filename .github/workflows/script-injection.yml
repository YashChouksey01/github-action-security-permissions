name: Title Issues (Script Injection Example)
on:
  issues:
    types:
      - opened
jobs:
  tittle-issue:
    runs-on: ubuntu-slim
    steps:
      - name: Assign label
        # env:
        #   TITLE: ${{ github.event.issue.title }}
        run: |
           issue_title="${{ github.event.issue.title }}"
           if [[ "$issue_title" == *"bug"* ]]; then      
           echo "Issue is about a bug"
           else
           echo "Issue is not about a bug"
           fi

# In Bash, you must put spaces after [[ and before ]].