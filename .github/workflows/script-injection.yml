name: Title Issues (Script Injection Example)
on:
  issues:
    types:
      - opened
jobs:
  tittle-issue:
    runs-on: ubuntu-slim
    steps:
      - name: assign label
        run: |
           issue_title="${{github.event.issue.tittle}}"
           if [["$issue_tittle" == *"bug"*]] ; then
           echo "Issue is about a bug"
           else
           echo "Issue is not about a bug"
           fi
